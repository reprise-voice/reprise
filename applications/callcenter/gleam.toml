name = "callcenter"
version = "0.1.0"
description = "Reprise call center: queues, agents and the dispatchers that connect them"
licences = ["MPL-2.0"]
target = "erlang"

[erlang]
application_start_module = "callcenter@app"

[dependencies]
kazoo_gleam = { path = "../../core/kazoo_gleam" }
gleam_stdlib = ">= 1.0.5 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"

[dev_dependencies]
gleeunit = ">= 1.11.0 and < 2.0.0"
