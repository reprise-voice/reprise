name = "stir"
version = "0.1.0"
description = "Reprise STIR/SHAKEN: signing keys and certificates, PASSporT signing and verification"
licences = ["MPL-2.0"]
target = "erlang"

[erlang]
application_start_module = "stir@app"

[dependencies]
kazoo_gleam = { path = "../../core/kazoo_gleam" }
gleam_stdlib = ">= 1.0.5 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"
gleam_crypto = ">= 1.6.0 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.11.0 and < 2.0.0"
