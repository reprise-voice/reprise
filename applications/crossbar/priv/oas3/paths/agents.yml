paths:
  /accounts/{ACCOUNT_ID}/agents:
    get:
      operationId: GetAccountsAccountIdAgents
      parameters:
        - $ref: '../oas3-parameters.yml#/auth_token_header'
        - $ref: '../oas3-parameters.yml#/ACCOUNT_ID'
      responses:
        200:
          description: Successful operation
      summary: Get all agents
      tags:
        - agents
  /accounts/{ACCOUNT_ID}/agents/{USER_ID}:
    get:
      operationId: GetAccountsAccountIdAgentsUserId
      parameters:
        - $ref: '../oas3-parameters.yml#/auth_token_header'
        - $ref: '../oas3-parameters.yml#/ACCOUNT_ID'
        - $ref: '../oas3-parameters.yml#/USER_ID'
      responses:
        200:
          description: Successful operation
      summary: Get a agents by ID
      tags:
        - agents
  /accounts/{ACCOUNT_ID}/agents/{USER_ID}/log:
    get:
      operationId: GetAccountsAccountIdAgentsUserIdLog
      parameters:
        - $ref: '../oas3-parameters.yml#/auth_token_header'
        - $ref: '../oas3-parameters.yml#/ACCOUNT_ID'
        - $ref: '../oas3-parameters.yml#/USER_ID'
        - description: The oldest change to answer with, in Gregorian seconds
          in: query
          name: created_from
          required: false
          schema:
            type: integer
        - description: The newest change to answer with, in Gregorian seconds
          in: query
          name: created_to
          required: false
          schema:
            type: integer
        - description: How many changes to answer with
          in: query
          name: page_size
          required: false
          schema:
            minimum: 1
            type: integer
      responses:
        200:
          description: Successful operation
      summary: Get log of agents
      tags:
        - agents
  /accounts/{ACCOUNT_ID}/agents/{USER_ID}/stats:
    get:
      operationId: GetAccountsAccountIdAgentsUserIdStats
      parameters:
        - $ref: '../oas3-parameters.yml#/auth_token_header'
        - $ref: '../oas3-parameters.yml#/ACCOUNT_ID'
        - $ref: '../oas3-parameters.yml#/USER_ID'
      responses:
        200:
          description: Successful operation
      summary: Get stats of agents
      tags:
        - agents
  /accounts/{ACCOUNT_ID}/agents/{USER_ID}/status:
    get:
      operationId: GetAccountsAccountIdAgentsUserIdStatus
      parameters:
        - $ref: '../oas3-parameters.yml#/auth_token_header'
        - $ref: '../oas3-parameters.yml#/ACCOUNT_ID'
        - $ref: '../oas3-parameters.yml#/USER_ID'
      responses:
        200:
          description: Successful operation
      summary: Get status of agents
      tags:
        - agents
    patch:
      operationId: PatchAccountsAccountIdAgentsUserIdStatus
      parameters:
        - $ref: '../oas3-parameters.yml#/auth_token_header'
        - $ref: '../oas3-parameters.yml#/ACCOUNT_ID'
        - $ref: '../oas3-parameters.yml#/USER_ID'
      requestBody:
        content:
          application/json:
            schema:
              description: The availability to change to, and who is changing it
              properties:
                availability:
                  description: What the agent, a supervisor or an automatic rule chose
                  enum:
                    - logged_out
                    - available
                    - available_on_demand
                    - on_break
                  type: string
                source:
                  default: ui
                  description: Who asked; only a supervisor may say supervisor
                  enum:
                    - ui
                    - supervisor
                  type: string
              required:
                - availability
              type: object
      responses:
        200:
          description: Successful operation
      summary: Patch specific fields of agents
      tags:
        - agents
