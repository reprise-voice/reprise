name = "kazoo_gleam"
version = "0.1.0"
description = "Kazoo bindings for Gleam applications in the reprise release"
licences = ["MPL-2.0"]
target = "erlang"

[dependencies]
gleam_stdlib = ">= 1.0.5 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"

[dev_dependencies]
gleeunit = ">= 1.11.0 and < 2.0.0"
